<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Sistema de Estudiantes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">
        Sistema de Gestión de Estudiantes
    </h1>

    <div class="card p-4 mb-4">

        <h3>Agregar Estudiante</h3>

        <form action="/agregar" method="POST">

            <input type="text"
                   name="nombre"
                   class="form-control mb-3"
                   placeholder="Nombre"
                   required>

            <input type="email"
                   name="correo"
                   class="form-control mb-3"
                   placeholder="Correo"
                   required>

            <input type="number"
                   name="edad"
                   class="form-control mb-3"
                   placeholder="Edad"
                   required>

            <input type="text"
                   name="carrera"
                   class="form-control mb-3"
                   placeholder="Carrera"
                   required>

            <button class="btn btn-primary">
                Guardar Estudiante
            </button>

        </form>

    </div>

    <div class="card p-4">

        <h3>Lista de Estudiantes</h3>

        <table class="table table-striped">

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Edad</th>
                    <th>Carrera</th>
                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody>

                {% for estudiante in estudiantes %}

                <tr>

                    <td>{{ estudiante[0] }}</td>
                    <td>{{ estudiante[1] }}</td>
                    <td>{{ estudiante[2] }}</td>
                    <td>{{ estudiante[3] }}</td>
                    <td>{{ estudiante[4] }}</td>
                    <td>

    <a href="/editar/{{ estudiante[0] }}"
       class="btn btn-warning btn-sm">

       Editar

    </a>

    <a href="/eliminar/{{ estudiante[0] }}"
       class="btn btn-danger btn-sm">

       Eliminar

    </a>

</td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
