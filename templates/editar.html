<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Editar Estudiante</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4">

        <h2 class="mb-4 text-primary">

            Editar Estudiante

        </h2>

        <form action="/actualizar/{{ estudiante[0] }}"
              method="POST">

            <label>Nombre</label>

            <input type="text"
                   name="nombre"
                   value="{{ estudiante[1] }}"
                   class="form-control mb-3"
                   required>

            <label>Correo</label>

            <input type="email"
                   name="correo"
                   value="{{ estudiante[2] }}"
                   class="form-control mb-3"
                   required>

            <label>Edad</label>

            <input type="number"
                   name="edad"
                   value="{{ estudiante[3] }}"
                   class="form-control mb-3"
                   required>

            <label>Carrera</label>

            <input type="text"
                   name="carrera"
                   value="{{ estudiante[4] }}"
                   class="form-control mb-3"
                   required>

            <button class="btn btn-warning">

                Actualizar

            </button>

            <a href="/"
               class="btn btn-secondary">

               Cancelar

            </a>

        </form>

    </div>

</div>

</body>

</html>
