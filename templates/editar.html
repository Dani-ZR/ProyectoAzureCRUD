<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Editar Estudiante</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4">

        <h2 class="mb-4">Editar Estudiante</h2>

        <form action="/actualizar/{{ estudiante[0] }}" method="POST">

            <input type="text"
                   name="nombre"
                   class="form-control mb-3"
                   value="{{ estudiante[1] }}"
                   required>

            <input type="email"
                   name="correo"
                   class="form-control mb-3"
                   value="{{ estudiante[2] }}"
                   required>

            <input type="number"
                   name="edad"
                   class="form-control mb-3"
                   value="{{ estudiante[3] }}"
                   required>

            <input type="text"
                   name="carrera"
                   class="form-control mb-3"
                   value="{{ estudiante[4] }}"
                   required>

            <button class="btn btn-success">
                Actualizar
            </button>

            <a href="/" class="btn btn-secondary">
                Volver
            </a>

        </form>

    </div>

</div>

</body>
</html>
